<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>堆排序可视化</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-container">
      <header>
        <h1>堆排序 (Heap Sort) 可视化</h1>
      </header>

      <section class="controls-panel">
        <div class="input-group">
          <label for="array-input">输入数组:</label>
          <input type="text" id="array-input" value="15, 3, 17, 10, 84, 19, 6, 22, 9" />
        </div>
        <div class="button-group">
          <button id="btn-init">初始化</button>
          <button id="btn-prev" disabled>上一步</button>
          <button id="btn-next" disabled>下一步</button>
          <button id="btn-auto" disabled>自动播放</button>
        </div>
      </section>

      <section class="status-bar">
        <p id="action-message">请点击初始化开始</p>
      </section>

      <section class="visualization-stage">
        <!-- 树视图区：底层放 SVG 画线，上层放 DOM 节点 -->
        <div id="tree-container" class="tree-view">
          <svg id="tree-lines" width="100%" height="100%"></svg>
          <!-- TS 将在这里动态插入节点 -->
        </div>

        <div id="array-container" class="array-view">
          <!-- TS 将在这里动态插入数组块 -->
        </div>
      </section>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
